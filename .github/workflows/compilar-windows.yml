name: Compilar CapturaLibre DNET para Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        run: dotnet build CapturaLibre/CapturaLibre.csproj -c Release
      - name: Publicar EXE x64 independiente de .NET instalado
        shell: pwsh
        run: |
          dotnet publish CapturaLibre/CapturaLibre.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o publicar_2.5.3
      - name: Instalar compilador de Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Crear instalador de Windows
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Instalador\CapturaLibre_DNET.iss'
      - name: Guardar ejecutable compilado
        uses: actions/upload-artifact@v4
        with:
          name: CapturaLibre-DNET-2.5.3-Windows-x64
          path: |
            publicar_2.5.3/
            instalador_2.5.3/
          if-no-files-found: error
